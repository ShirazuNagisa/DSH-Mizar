# Gradle settings for this checkout.
#
# `GRADLE_USER_HOME` is not set here on purpose: the developer sets it to
# `<checkout>/.gradle-home` (see docs/android.md) so caches stay inside the
# project. `org.gradle.java.home` is likewise machine-specific and lives in that
# same home's global gradle.properties, not in this file.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
