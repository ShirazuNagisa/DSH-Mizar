# Watch DSH's release channel and answer one question automatically:
# does the newest rc still compile against this plugin?
#
# DSH compares the `@deepseek-ai/dsh-*` versions a plugin declares with the
# runtime's, exactly, and refuses to install on a mismatch. So every rc costs a
# plugin version bump; the only open question is whether it also costs a
# migration. This answers that every six hours:
#
#   pinned version == newest rc        -> nothing to do
#   typecheck green against the new rc -> a pull request you merge
#   typecheck red                      -> an issue with the compiler's words
#
# The notification is plain GitHub: a pull request asks you for review, an issue
# lands in your inbox (and the GitHub app), and a failed scheduled run emails the
# person who last touched this file. Nothing else has to be running.
name: Watch DSH rc releases

on:
  schedule:
    # GitHub's cron is UTC; :17 past every sixth hour, not on the hour, because
    # everything scheduled on the hour queues behind everything else.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-rc-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Which rc are we on, and which one is out?
        id: versions
        run: |
          set -euo pipefail
          published=$(npm view @deepseek-ai/dsh-base dist-tags --json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).next))')
          # The plugin's peer pin marks which runtime it targets; every
          # @deepseek-ai/dsh-* package is released in lockstep with it.
          pinned=$(node -e 'console.log(require("./package.json").peerDependencies["@deepseek-ai/dsh-api-gateway"])')
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$pinned" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already targeting DSH \`$pinned\`; nothing newer is published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Pinned \`$pinned\`, published \`$published\` -- probing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bump to the published rc and try to compile against it
        if: steps.versions.outputs.changed == 'true'
        id: bump
        run: |
          set -uo pipefail
          next='${{ steps.versions.outputs.published }}'
          node - "$next" <<'JS'
          const fs = require('node:fs')
          const next = process.argv[2]
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          for (const section of ['peerDependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] ?? {})) {
              if (name.startsWith('@deepseek-ai/dsh-')) pkg[section][name] = next
            }
          }
          pkg.version = pkg.version.replace(/\d+$/, (n) => String(Number(n) + 1))
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          const index = fs.readFileSync('src/index.ts', 'utf8')
          fs.writeFileSync('src/index.ts',
            index.replace(/MIZAR_VERSION = '[^']*'/, `MIZAR_VERSION = '${pkg.version}'`))
          console.log(`plugin ${pkg.version} targets DSH ${next}`)
          JS
          # Every failure here is a finding rather than a crash: the decision
          # steps below read these outputs. An install failure is itself a
          # migration signal, so it must reach the issue, not just a red run.
          if npm install --legacy-peer-deps --no-audit --no-fund > /tmp/install.log 2>&1; then
            echo "install=ok" >> "$GITHUB_OUTPUT"
          else
            echo "install=failed" >> "$GITHUB_OUTPUT"
          fi
          if npm run typecheck > /tmp/typecheck.log 2>&1; then
            echo "api=compatible" >> "$GITHUB_OUTPUT"
          else
            echo "api=broken" >> "$GITHUB_OUTPUT"
          fi
          if npm test > /tmp/test.log 2>&1; then
            echo "tests=ok" >> "$GITHUB_OUTPUT"
          else
            echo "tests=failed" >> "$GITHUB_OUTPUT"
          fi
          if npm run build > /tmp/build.log 2>&1; then
            echo "build=ok" >> "$GITHUB_OUTPUT"
          else
            echo "build=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure the labels used below exist
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dsh-upgrade --color FBCA04 --description 'DSH runtime update' 2>/dev/null || true

      - name: API is compatible -- open a pull request with the bump
        if: steps.bump.outputs.api == 'compatible' && steps.bump.outputs.tests == 'ok' && steps.bump.outputs.build == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next='${{ steps.versions.outputs.published }}'
          version=$(node -p 'require("./package.json").version')
          branch="dsh-rc/$next"
          git config user.name 'dsh-rc-watch'
          git config user.email 'dsh-rc-watch@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "Target DSH $next"
          git push -u origin "$branch"
          {
            echo "DSH **$next** is out; this plugin pinned **${{ steps.versions.outputs.pinned }}**."
            echo
            echo 'The bump compiles: `typecheck` is clean, the tests pass, and `lib/` is'
            echo "rebuilt in this branch. Plugin version **$version**."
            echo
            echo 'Merging this is the release act -- nothing here was pushed to `main`,'
            echo 'and the version bump is part of the change.'
          } > /tmp/pr-body.md
          gh pr create --base main --head "$branch" \
            --title "Target DSH $next" \
            --body-file /tmp/pr-body.md \
            --label dsh-upgrade || true
          echo "Pull request opened for \`$next\`." >> "$GITHUB_STEP_SUMMARY"

      - name: API changed -- file an issue with the compiler's own words
        if: steps.bump.outputs.install == 'failed' || steps.bump.outputs.api == 'broken' || steps.bump.outputs.tests == 'failed' || steps.bump.outputs.build == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          next='${{ steps.versions.outputs.published }}'
          {
            echo "DSH \`$next\` is out and this plugin does not come through cleanly."
            echo
            echo "Pinned: \`${{ steps.versions.outputs.pinned }}\`. Until this is migrated the"
            echo 'plugin is not installable on the new runtime: DSH compares the'
            echo '`@deepseek-ai/dsh-*` peers exactly and rejects a mismatch.'
            echo
            echo "| step | result |"
            echo "|---|---|"
            echo "| install | \`${{ steps.bump.outputs.install }}\` |"
            echo "| typecheck | \`${{ steps.bump.outputs.api }}\` |"
            echo "| tests | \`${{ steps.bump.outputs.tests }}\` |"
            echo "| build | \`${{ steps.bump.outputs.build }}\` |"
            for log in install typecheck test build; do
              if [ -s "/tmp/$log.log" ]; then
                echo
                echo "### $log"
                echo '```'
                tail -80 "/tmp/$log.log"
                echo '```'
              fi
            done
            echo
            echo 'Reading it: the `@deepseek-ai/dsh-*` packages *are* the API — diff their'
            echo '`lib/types/*.d.ts` against the pinned version for the breaking change,'
            echo 'migrate, `npm run build` so the committed `lib/` matches, then bump.'
          } > /tmp/issue-body.md
          gh issue create \
            --title "DSH $next breaks the plugin: migration needed" \
            --body-file /tmp/issue-body.md \
            --label dsh-upgrade || true
          echo "Issue filed for \`$next\`: migration needed." >> "$GITHUB_STEP_SUMMARY"
          # Also leave the run red: a scheduled run's failure is emailed to the
          # person who last touched this file, which is half the point.
          exit 1
